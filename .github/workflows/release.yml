name: Release bundle

# Builds the Docker bundle from a release tag and attaches its files to that tag's GitHub release.
# Create the release first (a draft is fine), then run this workflow with the tag. The files are
# built here so that a release does not depend on a maintainer's upload connection, and so that
# every release is built from exactly the tagged commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v2.0.0a2
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    name: Build and attach the Docker bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag and its release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft
      - name: Free disk space for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The containerd image store saves layers compressed (the classic store triples the archive size).
      - name: Use the containerd image store
        run: |
          sudo mkdir -p /etc/docker
          [[ -s /etc/docker/daemon.json ]] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Docker {{.ServerVersion}}, storage {{.Driver}} {{.DriverStatus}}'
          docker info --format '{{.DriverStatus}}' | grep -q 'io.containerd.snapshotter'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check that the tag names the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match package version $version"; exit 1; }
      - name: Build both images and the bundle
        run: |
          packaging/docker/build-bundle.sh "$RUNNER_TEMP/bundle" both
          df -h /
      - name: Smoke-test the CPU image
        run: packaging/docker/smoke.sh "$(head -n 1 "$RUNNER_TEMP/bundle/image-cpu.txt")"
      - name: Make the release files
        working-directory: ${{ runner.temp }}/bundle
        run: |
          version=${TAG#v}
          sha256sum -c SHA256SUMS
          split -b 1900M -d images-cuda.tar images-cuda.tar.part-
          rm images-cuda.tar
          tar -czf "organoidtracker-docker-$version.tar.gz" --transform "s,^,organoidtracker-docker-$version/," \
              organoidtracker README.md LICENSE NOTICE SHA256SUMS source-revision.txt source.tar image-*.txt image-*.json
          ls -l
          cat image-cpu.txt image-cuda.txt
          sha256sum "organoidtracker-docker-$version.tar.gz" images-cpu.tar images-cuda.tar.part-*
      - name: Attach the files to the release
        working-directory: ${{ runner.temp }}/bundle
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "organoidtracker-docker-${TAG#v}.tar.gz" images-cpu.tar images-cuda.tar.part-*
