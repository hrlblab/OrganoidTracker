<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organoid Tracker</title>
<style>
html,body{height:100%;margin:0;font:15px system-ui;background:#20242b;color:#fff}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:20px;padding:10px 18px}a{color:#9cdbff}button{font:inherit;padding:5px 10px;cursor:pointer}#status{flex:1}iframe{flex:1;width:100%;border:0;min-height:0}#notice{padding:8px 18px;background:#344759;display:none}
</style></head><body>
<header><strong>Organoid Tracker</strong><a href="/reports/">Results</a><span id="status">Connecting…</span><button id="size">Display at 1:1</button><button id="stop">Stop application</button></header>
<div id="notice">Selected reports: <a id="report" href="/reports/">Open report folder</a></div>
<iframe id="desktop" title="Organoid Tracker desktop" src="/vnc.html?autoconnect=1&amp;resize=scale&amp;reconnect=1"></iframe>
<script>
let stopped=false,one=false,sequence=null;
document.querySelector('#size').onclick=()=>{one=!one;document.querySelector('#desktop').src='/vnc.html?autoconnect=1&reconnect=1&resize='+(one?'off':'scale');document.querySelector('#size').textContent=one?'Fit display':'Display at 1:1';};
document.querySelector('#stop').onclick=async()=>{if(!confirm('Stop the application? A running job will cancel after its current frame and save retained results.'))return;stopped=true;document.querySelector('#status').textContent='Stopping and saving retained results…';await fetch('/api/stop',{method:'POST',headers:{'X-OrganoidTracker':'local'}});};
async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error();const s=await r.json();if(!stopped)document.querySelector('#status').textContent=s.ready?'Ready · closing this tab leaves the application running':'Starting…';if(s.report&&s.report.sequence!==sequence){sequence=s.report.sequence;document.querySelector('#report').href=s.report.url;document.querySelector('#notice').style.display='block';}}catch(e){document.querySelector('#status').textContent=stopped?'Application stopped. Start it again with the launcher.':'Connection lost. The launcher can show application status.';}}
refresh();setInterval(refresh,1000);
</script></body></html>
