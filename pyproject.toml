[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "organoidtracker"
version = "2.0.0a0"
description = "SAM2-powered zero-shot tracking and quantitative analysis of cysts in kidney organoid time-lapse videos"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Organoid Tracker contributors" }]
keywords = ["kidney organoid", "cyst", "SAM2", "video segmentation", "time-lapse microscopy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "iopath>=0.1.10",
  "tqdm>=4.66",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "reportlab>=4.0",
]

[project.optional-dependencies]
# The Tk desktop application needs only the standard library's tkinter, which ships with the
# interpreter (Debian/Ubuntu: `apt install python3-tk`). The extra exists so that
# `uv sync --extra tk` names what is being installed.
tk = []
# Choose one accelerator extra. Without either, torch comes from PyPI (CUDA build on Linux,
# CPU build on Windows). `cpu` is what CI uses; `cuda` selects the CUDA 13.0 wheels, which
# support RTX 50-series GPUs and need an NVIDIA driver of the 580 series or newer.
cpu = ["torch>=2.7", "torchvision>=0.22"]
cuda = ["torch>=2.7", "torchvision>=0.22"]
# Interfaces that later work packages add; declared now so that the lock file already covers
# them. `qt`: the PySide6 desktop application. `hf`: the Hugging Face `transformers` video
# backends (SAM 2.1, SAM 3.1 tracker, EdgeTAM) and model downloads.
qt = ["pyside6>=6.11,<6.12"]
hf = ["transformers>=5.19"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
  "pre-commit>=4.0",
  "mypy>=1.14",
]

[project.scripts]
organoidtracker = "organoidtracker.cli:main"
organoidtracker-tk = "organoidtracker.gui_tk.launcher:main"

[project.urls]
Repository = "https://github.com/hrlblab/OrganoidTracker"
Paper = "https://arxiv.org/abs/2509.11063"
Changelog = "https://github.com/hrlblab/OrganoidTracker/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Two top-level packages: the application and the vendored upstream SAM 2 (kept under its
# own name so that its Hydra configs and `_target_` paths keep working unchanged).
packages = ["src/organoidtracker", "src/sam2"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "checkpoints/download_ckpts.sh"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# Supported platforms (no macOS); keeps the lock file to wheels that exist on both indexes.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast tests with synthetic data and no model (default)",
  "gui: opens Tk windows; needs a display",
  "model: runs the real SAM 2.1 tiny model; skipped when checkpoints/sam2.1_hiera_tiny.pt is absent",
  "data: needs lab videos under OT_PLATES_DIR; skipped when unset and never run in CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# The vendored upstream SAM 2 package is neither linted nor formatted.
extend-exclude = ["src/sam2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501", # line length is the formatter's job; long strings and comments may stay
  "B905", # zip(strict=...) only adds noise where equal-length sequences are paired
]

[tool.mypy]
python_version = "3.12"
# Type-checked modules: the core and services packages, the command line and the small
# infrastructure modules. The legacy analysis, io and Tk modules are not checked yet.
files = [
  "src/organoidtracker/core",
  "src/organoidtracker/services",
  "src/organoidtracker/cli.py",
  "src/organoidtracker/config.py",
  "src/organoidtracker/logging_config.py",
  "src/organoidtracker/paths.py",
  "src/organoidtracker/settings.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
